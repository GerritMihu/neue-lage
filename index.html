<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neue Lage</title>
<meta name="description" content="Verbleibende Studientage (Mo–Do) bis Ende Wintersemester 31.01.2027">
<meta property="og:title" content="Neue Lage">
<meta property="og:description" content="Verbleibende Studientage (Mo–Do) bis Ende Wintersemester 31.01.2027">
<meta property="og:type" content="website">
<meta name="theme-color" content="#1e1e2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --base: #1e1e2e;
    --text: #cdd6f4;
    --mauve: #cba6f7;
    --blue: #89b4fa;
    --red: #f38ba8;
    --overlay: #6c7086;
    --yellow: #f9e2af;
    --peach: #fab387;
    --green: #a6e3a1;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow-x: hidden; }
  body {
    background: var(--base);
    color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    text-align: center;
  }
  main { width: 100%; max-width: 640px; }
  h1 { color: var(--mauve); font-size: clamp(1.8rem, 8vw, 2.6rem); }
  hr { border: 0; border-top: 2px solid var(--overlay); margin: 0.8em 0; }
  #tage {
    color: var(--blue);
    font-size: clamp(6rem, 38vw, 11rem);
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #tage.knapp { color: var(--red); }
  #tage.fertig { color: var(--green); font-size: clamp(3rem, 17vw, 6rem); }
  .label { color: var(--mauve); font-size: clamp(1.1rem, 5vw, 1.5rem); }
  #countdown {
    color: var(--blue);
    font-size: clamp(1.6rem, 9vw, 2.6rem);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .klein { font-size: clamp(0.95rem, 4vw, 1.2rem); margin-top: 0.4em; }
  .klein b { color: var(--blue); }
  #eier { margin-top: 1.2em; display: flex; flex-direction: column; gap: 0.5em; align-items: center; }
  .ei {
    color: var(--base);
    background: var(--yellow);
    font-weight: 700;
    font-size: clamp(1.1rem, 5.5vw, 1.6rem);
    padding: 0.35em 0.8em;
    border-radius: 999px;
    animation: wackeln 1.2s ease-in-out infinite;
  }
  .ei.doener { background: var(--peach); }
  .ei.ruhig { background: var(--mauve); }
  @keyframes wackeln {
    0%, 100% { transform: rotate(-3deg) scale(1); }
    50% { transform: rotate(3deg) scale(1.06); }
  }
  .regen {
    position: fixed;
    top: -3rem;
    pointer-events: none;
    z-index: 10;
    animation: fallen linear forwards;
  }
  @keyframes fallen { to { transform: translateY(calc(100vh + 6rem)) rotate(360deg); } }
  #krug {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5em;
    background: rgba(17, 17, 27, 0.9);
    color: var(--yellow);
    font-size: clamp(1.4rem, 7vw, 2.2rem);
    font-weight: 700;
  }
  #krug[hidden] { display: none; }
  .glas-wrap { position: relative; }
  .glas {
    position: relative;
    width: 140px;
    height: 200px;
    border: 6px solid var(--text);
    border-top: none;
    border-radius: 0 0 18px 18px;
    overflow: hidden;
  }
  .henkel {
    position: absolute;
    right: -46px;
    top: 40px;
    width: 46px;
    height: 100px;
    border: 6px solid var(--text);
    border-left: none;
    border-radius: 0 30px 30px 0;
  }
  .bier {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 0;
    background: linear-gradient(var(--yellow), var(--peach));
    border-top: 22px solid #fff;
    animation: fuellen 3s ease-out forwards;
  }
  @keyframes fuellen { from { height: 0; } to { height: 88%; } }
  @media (prefers-reduced-motion: reduce) { .ei { animation: none; } }
</style>
</head>
<body>
<main>
  <h1>Neue Lage</h1>
  <hr>
  <div id="tage">–</div>
  <div class="label" id="tage-label">Studientage (Mo–Do)</div>
  <hr>
  <div id="countdown">–</div>
  <div class="klein"><b id="kalender">–</b> <span class="label">Kalendertage bis 31.01.2027</span></div>
  <div id="eier"></div>
</main>
<div id="krug" hidden>
  <div class="glas-wrap"><div class="glas"><div class="bier"></div></div><div class="henkel"></div></div>
  <div>Prost! 🍻</div>
</div>
<script>
const ENDE = '2027-01-31';
// Freie Tage (nicht gezählt): 'YYYY-MM-DD' oder ['YYYY-MM-DD', 'YYYY-MM-DD'] als Bereich
const FREIE_TAGE = [
  '2026-12-08',                   // Mariä Empfängnis
  ['2026-12-24', '2027-01-06'],   // Weihnachtsferien
];

const datum = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const key = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const naechster = d => new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);

const frei = new Set();
for (const e of FREIE_TAGE) {
  const [von, bis] = Array.isArray(e) ? e : [e, e];
  for (let d = datum(von); d <= datum(bis); d = naechster(d)) frei.add(key(d));
}

const ende = datum(ENDE);
const endeMitternacht = naechster(ende);
const pad = n => String(n).padStart(2, '0');

let studientage = 0;

function tage(jetzt = new Date()) {
  let n = 0;
  for (let d = new Date(jetzt.getFullYear(), jetzt.getMonth(), jetzt.getDate()); d <= ende; d = naechster(d)) {
    const wt = d.getDay();
    if (wt >= 1 && wt <= 4 && !frei.has(key(d))) n++;
  }
  studientage = n;
  const heute = new Date(jetzt.getFullYear(), jetzt.getMonth(), jetzt.getDate());
  const kal = Math.max(0, Math.round((ende - heute) / 86400000) + 1);
  const el = document.getElementById('tage');
  el.textContent = n === 0 ? 'FERTIG!' : n;
  el.classList.toggle('knapp', n > 0 && n <= 10);
  el.classList.toggle('fertig', n === 0);
  document.getElementById('tage-label').textContent = n === 0 ? 'Geschafft! 🎓' : 'Studientage (Mo–Do)';
  document.getElementById('kalender').textContent = kal;
}

function regen(zeichen, anzahl = 50) {
  for (let i = 0; i < anzahl; i++) {
    const s = document.createElement('span');
    s.className = 'regen';
    s.textContent = zeichen[Math.floor(Math.random() * zeichen.length)];
    s.style.left = Math.random() * 92 + 'vw';
    s.style.fontSize = 1.2 + Math.random() * 1.6 + 'rem';
    s.style.animationDuration = 2 + Math.random() * 2 + 's';
    s.style.animationDelay = Math.random() * 1.5 + 's';
    s.addEventListener('animationend', () => s.remove());
    document.body.appendChild(s);
  }
}
const konfetti = () => regen(['🎉', '🎊', '✨', '🥳']);

function countdown() {
  const r = Math.max(0, Math.floor((endeMitternacht - new Date()) / 1000));
  document.getElementById('countdown').textContent =
    `${Math.floor(r / 86400)}T ${pad(Math.floor(r % 86400 / 3600))}:${pad(Math.floor(r % 3600 / 60))}:${pad(r % 60)}`;
}

const istSilvester = d => d.getMonth() === 11 && d.getDate() === 31;

function eier(jetzt = new Date(), n = studientage) {
  const liste = [];
  const min = jetzt.getHours() * 60 + jetzt.getMinutes();
  const zwischen = (von, bis) => min >= von && min < bis;
  const tag = jetzt.getDay();

  if (zwischen(9 * 60 + 50, 10 * 60 + 10)) liste.push(['🍺 10-Uhr-Bier! Prost!', '']);
  if (zwischen(12 * 60, 12 * 60 + 30)) liste.push(['🥨 Mahlzeit!', '']);
  if (min === 13 * 60 + 37) liste.push(['⏰ 13:37 – leet', 'ruhig']);
  if (zwischen(14 * 60, 14 * 60 + 30)) liste.push(['😴 Mittagstief: Konzentration auf Werkseinstellung', 'ruhig']);
  if (min >= 23 * 60 || min < 4 * 60) liste.push(['🌙 Geh schlafen, die Arbeit ist morgen auch noch da', 'ruhig']);

  if (tag === 2) liste.push(['🌯 Dürüm-Dienstag', 'doener']);
  if (tag === 4) liste.push(['🥙 Döner-Donnerstag', 'doener']);
  if (tag === 5) liste.push(['🍻 Feierabend-Freitag! Wochenende eingeläutet', 'doener']);
  if (tag === 0 || tag === 6) liste.push(['🛋️ Wochenende. Studium? Nie gehört.', 'ruhig']);

  if (istSilvester(jetzt)) liste.push(['🎆 Guten Rutsch!', '']);
  else if (frei.has(key(jetzt))) liste.push(['🎄 Frei! Die Zahl bleibt eh stehen', 'ruhig']);

  if (n === 42) liste.push(['🌌 42 – die Antwort auf alles', 'ruhig']);
  if (n === 30 || n === 20 || n === 10) liste.push([`💪 Nur noch ${n}! Durchhalten!`, '']);

  const html = liste.map(([text, cls]) => `<div class="ei ${cls}">${text}</div>`).join('');
  const el = document.getElementById('eier');
  if (el.innerHTML !== html) el.innerHTML = html;
}

// 5x auf die Zahl tippen: Döner-Regen
let taps = 0, tapTimer;
document.getElementById('tage').addEventListener('click', () => {
  taps++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { taps = 0; }, 1500);
  if (taps >= 5) { taps = 0; regen(['🥙']); }
});

// Konami-Code: Bierkrug füllt sich
const KONAMI = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
let konamiPos = 0;
const krug = document.getElementById('krug');
document.addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  konamiPos = k === KONAMI[konamiPos] ? konamiPos + 1 : (k === KONAMI[0] ? 1 : 0);
  if (konamiPos === KONAMI.length) {
    konamiPos = 0;
    const alt = krug.querySelector('.bier');
    alt.replaceWith(alt.cloneNode());
    krug.hidden = false;
  }
});
krug.addEventListener('click', () => { krug.hidden = true; });

tage();
countdown();
eier();
if (studientage === 0 || istSilvester(new Date())) konfetti();
setInterval(() => { countdown(); eier(); }, 1000);
setInterval(tage, 60000);
</script>
</body>
</html>
